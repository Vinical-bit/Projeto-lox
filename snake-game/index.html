<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Jogo da Cobrinha</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #1b1f23;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    color: #eee;
  }

  header {
    width: 100%;
    max-width: 520px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 1.1rem;
    margin: 0;
    color: #7CFC7C;
    letter-spacing: 1px;
  }

  #score-box {
    font-size: 1rem;
    font-weight: bold;
    background: #262b31;
    padding: 6px 14px;
    border-radius: 999px;
  }

  #board-wrap {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 0;
    padding: 4px 12px;
  }

  #board {
    background: #10131a;
    border-radius: 12px;
    box-shadow: 0 0 0 2px #2f3742, 0 8px 24px rgba(0,0,0,0.5);
    touch-action: none;
    max-width: 100%;
    max-height: 100%;
  }

  #controls {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: 64px 64px 64px;
    grid-template-rows: 64px 64px 64px;
    gap: 8px;
    padding: 10px 0 max(14px, env(safe-area-inset-bottom));
  }

  .ctrl-btn {
    background: #262b31;
    border: none;
    border-radius: 14px;
    color: #7CFC7C;
    font-size: 1.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }

  .ctrl-btn:active {
    background: #35404a;
    transform: scale(0.95);
  }

  .up    { grid-column: 2; grid-row: 1; }
  .left  { grid-column: 1; grid-row: 2; }
  .right { grid-column: 3; grid-row: 2; }
  .down  { grid-column: 2; grid-row: 3; }

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 15, 0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 24px;
  }

  #overlay.hidden { display: none; }

  #overlay h2 {
    color: #ff5c5c;
    margin: 0;
    font-size: 1.6rem;
  }

  #overlay p {
    margin: 0;
    color: #ccc;
    font-size: 1rem;
  }

  #start-btn, #retry-btn {
    background: #7CFC7C;
    color: #10131a;
    border: none;
    padding: 14px 32px;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 999px;
    touch-action: manipulation;
  }

  #start-btn:active, #retry-btn:active {
    transform: scale(0.96);
  }

  #hint {
    color: #888;
    font-size: 0.85rem;
    margin-top: -4px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🐍 Cobrinha</h1>
    <div id="score-box">Pontos: <span id="score">0</span></div>
  </header>

  <div id="board-wrap">
    <canvas id="board"></canvas>
  </div>

  <div id="controls">
    <button class="ctrl-btn up" data-dir="up">▲</button>
    <button class="ctrl-btn left" data-dir="left">◀</button>
    <button class="ctrl-btn right" data-dir="right">▶</button>
    <button class="ctrl-btn down" data-dir="down">▼</button>
  </div>

  <div id="overlay">
    <h2 id="overlay-title">Jogo da Cobrinha</h2>
    <p id="overlay-msg">Deslize o dedo ou use os botões para mover.</p>
    <button id="start-btn">Começar</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  const GRID_SIZE = 18;
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlay-title");
  const overlayMsg = document.getElementById("overlay-msg");
  const startBtn = document.getElementById("start-btn");
  const boardWrap = document.getElementById("board-wrap");

  let cellSize, snake, direction, nextDirection, food, score, best, loopId, running;

  best = Number(localStorage.getItem("snake-best") || 0);

  function resizeCanvas() {
    const wrapRect = boardWrap.getBoundingClientRect();
    const size = Math.floor(Math.min(wrapRect.width, wrapRect.height) - 4);
    const dpr = window.devicePixelRatio || 1;
    cellSize = Math.floor(size / GRID_SIZE);
    const pixelSize = cellSize * GRID_SIZE;

    canvas.style.width = pixelSize + "px";
    canvas.style.height = pixelSize + "px";
    canvas.width = pixelSize * dpr;
    canvas.height = pixelSize * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (!running) draw();
  }

  function randomFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * GRID_SIZE),
        y: Math.floor(Math.random() * GRID_SIZE),
      };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    return pos;
  }

  function resetGame() {
    snake = [
      { x: 8, y: 9 },
      { x: 7, y: 9 },
      { x: 6, y: 9 },
    ];
    direction = "right";
    nextDirection = "right";
    score = 0;
    scoreEl.textContent = score;
    food = randomFood();
  }

  function draw() {
    const px = cellSize * GRID_SIZE;
    ctx.clearRect(0, 0, px, px);

    ctx.fillStyle = "#10131a";
    ctx.fillRect(0, 0, px, px);

    ctx.fillStyle = "#ff5c5c";
    roundRect(food.x * cellSize + 2, food.y * cellSize + 2, cellSize - 4, cellSize - 4, 6);
    ctx.fill();

    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? "#a4ff8c" : "#5fce5f";
      roundRect(seg.x * cellSize + 1, seg.y * cellSize + 1, cellSize - 2, cellSize - 2, 5);
      ctx.fill();
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  const OPPOSITE = { up: "down", down: "up", left: "right", right: "left" };

  function setDirection(dir) {
    if (dir !== OPPOSITE[direction]) {
      nextDirection = dir;
    }
  }

  function tick() {
    direction = nextDirection;
    const head = { ...snake[0] };

    if (direction === "up") head.y -= 1;
    if (direction === "down") head.y += 1;
    if (direction === "left") head.x -= 1;
    if (direction === "right") head.x += 1;

    const hitWall = head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE;
    const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);

    if (hitWall || hitSelf) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 1;
      scoreEl.textContent = score;
      food = randomFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function speedForScore() {
    return Math.max(70, 140 - score * 3);
  }

  function scheduleNext() {
    loopId = setTimeout(function step() {
      if (!running) return;
      tick();
      if (running) loopId = setTimeout(step, speedForScore());
    }, speedForScore());
  }

  function startGame() {
    resetGame();
    resizeCanvas();
    running = true;
    overlay.classList.add("hidden");
    scheduleNext();
  }

  function gameOver() {
    running = false;
    clearTimeout(loopId);
    if (score > best) {
      best = score;
      localStorage.setItem("snake-best", String(best));
    }
    overlayTitle.textContent = "Fim de jogo!";
    overlayMsg.textContent = `Pontos: ${score} — Recorde: ${best}`;
    startBtn.textContent = "Jogar de novo";
    overlay.classList.remove("hidden");
  }

  startBtn.addEventListener("click", startGame);

  document.querySelectorAll(".ctrl-btn").forEach(btn => {
    btn.addEventListener("touchstart", e => {
      e.preventDefault();
      setDirection(btn.dataset.dir);
    }, { passive: false });
    btn.addEventListener("click", () => setDirection(btn.dataset.dir));
  });

  document.addEventListener("keydown", e => {
    const map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
      w: "up", s: "down", a: "left", d: "right" };
    if (map[e.key]) {
      e.preventDefault();
      setDirection(map[e.key]);
    }
  });

  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener("touchstart", e => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });

  canvas.addEventListener("touchend", e => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? "right" : "left");
    } else {
      setDirection(dy > 0 ? "down" : "up");
    }
  }, { passive: true });

  window.addEventListener("resize", resizeCanvas);
  window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 200));

  resetGame();
  resizeCanvas();
})();
</script>
</body>
</html>
